name: Build Android APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Locate Build & Compile APK
        run: |
          # العثور تلقائياً على مجلد الأندرويد وبناء التطبيق
          if [ -d "app" ]; then
            cd .
          elif [ -d "RustOverlayProject" ]; then
            cd RustOverlayProject
          else
            cd $(find . -maxdepth 2 -type d -name "*app*" | head -n 1)
          fi
          
          # إعداد الجريدل والبناء
          gradle wrapper
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v3
        with:
          name: app-debug
          path: '**/build/outputs/apk/debug/*.apk'
          path: '**/build/outputs/apk/debug/*.apk'

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v3
        with:
          name: app-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/debug/*.apk
        with:
          name: app-debug
          path: |
            **/build/outputs/apk/debug/*.apk
            project_dir/**/*.apk
