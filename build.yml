name: Build APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Unzip Project
        run: |
          unzip -q *.zip -d project_files

      - name: Build Info
        run: |
          echo "Project files extracted successfully."
          ls -la project_files
