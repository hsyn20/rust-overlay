name: Build APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Extract Project
        run: |
          unzip -q *.zip -d project_dir
          cd project_dir
          # لو الملفات بداخل مجلد فرعي، نتحقق ونرتبها
          ls -la

      - name: Build with Gradle (if gradlew exists)
        run: |
          cd project_dir
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            echo "Gradlew wrapper not found, creating basic structure..."
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v3
        with:
          name: app-debug
          path: |
            **/build/outputs/apk/debug/*.apk
            project_dir/**/*.apk
