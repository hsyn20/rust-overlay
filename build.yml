name: Build Android APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Find Project and Build APK
        run: |
          # البحث التلقائي عن مجلد المشروع والانتقال بداخله فوراً
          PROJECT_DIR=$(find . -maxdepth 2 -type d -name "*RustOverlay*" | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR="."
          fi
          echo "Using project directory: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          
          # توليد أداة البناء وبناء التطبيق
          gradle wrapper
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v3
        with:
          name: app-debug
          path: '**/build/outputs/apk/debug/*.apk'

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v3
        with:
          name: app-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/debug/*.apk
        with:
          name: app-debug
          path: |
            **/build/outputs/apk/debug/*.apk
            project_dir/**/*.apk
