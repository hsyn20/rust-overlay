name: Build Android APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare Project Files
        run: |
          # فك ضغط مجلد التطبيق إذا وجد
          if [ -f "app.zip" ]; then
            unzip -q app.zip
          elif [ -f "*.zip" ]; then
            unzip -q *.zip
          fi
          
          # التأكد من وجود ملف settings.gradle بالشكل الصحيح
          if [ ! -f "settings.gradle" ] && [ -f "settings.gradle.txt" ]; then
            cp settings.gradle.txt settings.gradle
          fi

      - name: Build APK with Gradle
        run: |
          gradle wrapper
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v3
        with:
          name: app-debug
          path: '**/build/outputs/apk/debug/*.apk'

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v3
        with:
          name: app-debug
          path: '**/build/outputs/apk/debug/*.apk'          name: app-debug
          path: '**/build/outputs/apk/debug/*.apk'
          path: '**/build/outputs/apk/debug/*.apk'

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v3
        with:
          name: app-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/debug/*.apk
        with:
          name: app-debug
          path: |
            **/build/outputs/apk/debug/*.apk
            project_dir/**/*.apk
